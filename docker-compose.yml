# siem-wazuh-ai (v10) — Wazuh 4.14.7 single-node + Apache mục tiêu + agent + redis + container "lab".
# Chạy từ thư mục chứa file này:  docker compose -p siem10 up -d   (xem README.md, đủ các bước)
# Mật khẩu bên dưới là mật khẩu LAB mặc định của wazuh-docker, chỉ dùng trên máy cá nhân; mọi cổng bind 127.0.0.1.

name: siem10

services:
  # ---------- Wazuh lõi (config + cert lấy từ vendor/wazuh-docker, xem setup/00_clone_wazuh.sh) ----------
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.7
    hostname: wazuh.manager
    restart: always
    networks: [siem10_net]
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 655360, hard: 655360}
    ports:
      - "127.0.0.1:45000:55000"      # Wazuh API
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - wazuh_api_configuration:/var/ossec/api/configuration
      - wazuh_etc:/var/ossec/etc
      - wazuh_logs:/var/ossec/logs
      - wazuh_queue:/var/ossec/queue
      - wazuh_var_multigroups:/var/ossec/var/multigroups
      - wazuh_integrations:/var/ossec/integrations
      - wazuh_active_response:/var/ossec/active-response/bin
      - wazuh_agentless:/var/ossec/agentless
      - wazuh_wodles:/var/ossec/wodles
      - filebeat_etc:/etc/filebeat
      - filebeat_var:/var/lib/filebeat
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./vendor/wazuh-docker/single-node/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
      - ./wazuh/local_decoder.xml:/wazuh-config-mount/etc/decoders/local_decoder.xml
      - ./wazuh/local_rules.xml:/wazuh-config-mount/etc/rules/local_rules.xml

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.7
    hostname: wazuh.indexer
    restart: always
    networks: [siem10_net]
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock: {soft: -1, hard: -1}
      nofile: {soft: 65536, hard: 65536}
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    hostname: wazuh.dashboard
    restart: always
    networks: [siem10_net]
    ports:
      - "127.0.0.1:8443:5601"        # https://localhost:8443
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=MyS3cr37P450r.*-
    volumes:
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./vendor/wazuh-docker/single-node/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./vendor/wazuh-docker/single-node/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
      - wazuh-dashboard-custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on: [wazuh.indexer]

  # ---------- Mục tiêu + agent ----------
  apache-target:
    build: ./apache
    image: siem-ai-apache:local
    hostname: apache-target
    container_name: apache-target
    restart: unless-stopped
    networks: [siem10_net]
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - apache_logs:/usr/local/apache2/logs

  wazuh-agent:
    image: wazuh/wazuh-agent:4.14.7
    hostname: apache-lab-agent
    container_name: wazuh-agent
    restart: unless-stopped
    networks: [siem10_net]
    environment:
      - WAZUH_MANAGER_SERVER=wazuh.manager
      - WAZUH_AGENT_NAME=apache-lab-agent
    depends_on: [wazuh.manager, apache-target]
    volumes:
      - ./agent/ossec.conf:/wazuh-config-mount/etc/ossec.conf
      - apache_logs:/var/log/apache-lab:ro
      # giữ client.keys (khóa đăng ký) qua các lần tạo lại container. Không có volume này, mỗi lần --force-recreate agent
      # sẽ xin đăng ký lại cùng tên và manager từ chối "Duplicate agent name" (trong 1 giờ đầu sau khi bản cũ ngắt).
      - wazuh_agent_etc:/var/ossec/etc

  redis:
    image: redis:7-alpine
    hostname: redis
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    networks: [siem10_net]
    volumes:
      - redis_data:/data

  # ---------- ai-service (mục 15): chấm điểm alert SIEMLAB -> index ai-enriched-alerts-* ----------
  # Bật:  docker compose -p siem10 --profile ai up -d ai-service      Xem log: docker logs -f ai-service
  # Chỉ ENRICHMENT: đọc alerts.json (read-only), không sửa alert gốc, không chặn IP, không học online.
  ai-service:
    image: siem-ai-lab:local
    profiles: ["ai"]
    container_name: ai-service
    restart: unless-stopped
    networks: [siem10_net]
    working_dir: /workspace
    depends_on: [redis, wazuh.indexer]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=SecretPassword
      - INDEXER_CA=/certs/root-ca.pem
    # --from-end: lần ĐẦU (chưa có checkpoint trong Redis) bắt đầu ở cuối alerts.json, không chấm lại lịch sử
    command: ["python3", "scripts/ai_service.py", "--model", "models/full1/model.joblib", "--op", "fp5", "--init-index", "--from-end"]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./models:/workspace/models:ro
      - ./output:/workspace/output
      - wazuh_logs:/wazuh-logs:ro
      - ./vendor/wazuh-docker/single-node/config/wazuh_indexer_ssl_certs/root-ca.pem:/certs/root-ca.pem:ro

  # ---------- Container "lab": sinh traffic, audit, trainer (chạy bằng run --rm) ----------
  # NET_ADMIN để run_batch.py thêm IP alias (mỗi phiên một srcip riêng). Xem README mục kiểm tra IP alias.
  lab:
    build: .
    image: siem-ai-lab:local
    profiles: ["lab"]
    networks: [siem10_net]
    cap_add: [NET_ADMIN]
    working_dir: /workspace
    depends_on: [apache-target]
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./tests:/workspace/tests:ro
      - ./apache:/workspace/apache:ro          # để tests/test_generator.py đối chiếu site_model với htdocs/cấu hình
      - ./data:/workspace/data
      - ./models:/workspace/models
      - ./output:/workspace/output
      - ./proposals:/workspace/proposals      # rule_proposer ghi đề xuất, compare_rules đọc luật đang áp
      - apache_logs:/apache-logs:ro
      - wazuh_logs:/wazuh-logs:ro

networks:
  siem10_net:
    name: siem10_net               # tên cố định để `docker run --network siem10_net --ip ...` (tool_run) dùng được
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.90.0/24
          ip_range: 172.30.90.0/28  # dịch vụ cố định lấy .2-.14; .32-.250 dành cho IP nguồn của generator

volumes:
  wazuh_api_configuration:
  wazuh_etc:
  wazuh_logs:
  wazuh_queue:
  wazuh_var_multigroups:
  wazuh_integrations:
  wazuh_active_response:
  wazuh_agentless:
  wazuh_wodles:
  filebeat_etc:
  filebeat_var:
  wazuh-indexer-data:
  wazuh-dashboard-config:
  wazuh-dashboard-custom:
  apache_logs:
  redis_data:
  wazuh_agent_etc:
