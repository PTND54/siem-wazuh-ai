<ossec_config>
  <client>
    <server>
      <address>wazuh.manager</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>generic</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
  </client>

  <!-- Hàng đợi/eps của agent. Mặc định 500 eps là giới hạn dễ chạm khi flood ~100 rps cộng nhiều phiên song song;
       nâng lên và để audit_coverage.py đo thật xem có mất sự kiện không (không giả định).
       21/10: 20000 -> 100000 để chứa trọn một đợt công cụ thật (dirb ~23k dòng, ab ~8k dòng trong vài giây) ở 1000 eps.
       LƯU Ý: chỗ mất thật sự đo được ở tools1 KHÔNG nằm ở đây mà ở hàng đợi của logcollector (logcollector.queue_size,
       mặc định 1024) -> setup/agent_tune.sh ghi local_internal_options.conf; 03_verify.sh kiểm "drops" = 0. -->
  <client_buffer>
    <disabled>no</disabled>
    <queue_size>100000</queue_size>
    <events_per_second>1000</events_per_second>
  </client_buffer>

  <!-- Luồng log riêng SIEMLAB -> decoder/rule tùy biến (wazuh/local_decoder.xml, local_rules.xml) -->
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/apache-lab/siem.log</location>
  </localfile>

  <!-- siem10, luật chữ ký (bật qua sig/docker-compose.sig.yml): access_log chuẩn dạng combined cho bộ luật web dựng sẵn
       (nhóm 31xxx, đã hạ các luật mã trạng thái) và luật chữ ký (1001xx). Bản gốc: agent/ossec.conf. -->
  <localfile>
    <log_format>apache</log_format>
    <location>/var/log/apache-lab/access_log</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
